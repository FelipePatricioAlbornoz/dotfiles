general {
    col.active_border = rgba(88948a77)
    col.inactive_border = rgba(3f494255)
}

misc {
    background_color = rgba(101511FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(101511FF)
        col.text = rgba(dfe4deFF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(dfe4de), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(dfe4de), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(dfe4de), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrule = border_color rgba(7dd9a5AA) rgba(7dd9a577), match:pin 1
