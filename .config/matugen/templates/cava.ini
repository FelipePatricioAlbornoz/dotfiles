[general]
bars = 0
bar_width = 2
bar_spacing = 1
framerate = 60

[color]
method = gradient
gradient = 1
gradient_count = 8
gradient_color_1 = '#{{colors.primary_container.default.hex_stripped}}'
gradient_color_2 = '#{{colors.primary.default.hex_stripped}}'
gradient_color_3 = '#{{colors.secondary.default.hex_stripped}}'
gradient_color_4 = '#{{colors.secondary_container.default.hex_stripped}}'
gradient_color_5 = '#{{colors.tertiary.default.hex_stripped}}'
gradient_color_6 = '#{{colors.tertiary_container.default.hex_stripped}}'
gradient_color_7 = '#{{colors.on_primary_container.default.hex_stripped}}'
gradient_color_8 = '#{{colors.on_tertiary.default.hex_stripped}}'

[output]
method = ncurses
channels = stereo
